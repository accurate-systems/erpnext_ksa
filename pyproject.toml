[project]
name = "erpnext_ksa"
authors = [
    { name = "Frappe Technologies", email = "contact@frappe.io"}
]
description = "App to hold regional code for Saudi Arabia, built on top of ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # was only in requirements.txt, which pip ignores now that pyproject.toml exists
    "pyqrcode~=1.2.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "erpnext_ksa"

# Frappe apps are resolved by bench from git, not PyPI — declare them here, not in
# [project.dependencies]. Frappe Cloud reads this block to validate bench compatibility.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
